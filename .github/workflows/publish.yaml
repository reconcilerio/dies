name: Publish

on:
  push:
    tags:
      # semver tags
      - 'v2/v[0-9]+\.[0-9]+\.[0-9]+'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: v2/go.mod
      - name: Build
        run: |
          set -euo pipefail

          GOOS=linux GOARCH=amd64 go -C v2 build -o ../diegen-linux-amd64 ./diegen
          GOOS=linux GOARCH=arm64 go -C v2 build -o ../diegen-linux-arm64 ./diegen
          GOOS=darwin GOARCH=arm64 go -C v2 build -o ../diegen-darwin-arm64 ./diegen
          GOOS=windows GOARCH=amd64 go -C v2 build -o ../diegen-windows-amd64.exe ./diegen
          GOOS=windows GOARCH=arm64 go -C v2 build -o ../diegen-windows-arm64.exe ./diegen
      - name: Draft GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: |
            diegen-*
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}
