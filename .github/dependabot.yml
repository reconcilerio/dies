version: 2
updates:
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: daily
- package-ecosystem: gomod
  directories:
  - "/v2"
  - "/v2/examples/clients"
  - "/v2/examples/kapp/sources"
  - "/v2/examples/knative/sources"
  - "/v2/conformance"
  schedule:
    interval: daily
  ignore:
  - dependency-name: k8s.io/*
    update-types:
    - version-update:semver-patch
